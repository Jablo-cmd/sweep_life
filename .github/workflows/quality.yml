name: Website quality checks
on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Export generated lockfile for reproducible bootstrap
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-bootstrap
          path: package-lock.json
          retention-days: 1
      - name: Report dependency advisories
        run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: npm run test:routes
      - run: npm run test:quality
      - name: Verify production SEO configuration
        env:
          PUBLIC_SITE_URL: https://preview.example.invalid
          PUBLIC_INDEXING_ENABLED: "true"
        run: |
          npm run build
          npm run test:quality
      - name: Verify expected routes
        run: |
          test -f dist/index.html
          test -f dist/pre-school/index.html
          test -f dist/primary-school/index.html
          test -f dist/admissions/index.html
          test -f dist/fees/index.html
          test -f dist/gallery/index.html
          test -f dist/about/index.html
          test -f dist/contact/index.html
          test -f dist/parent-portal/index.html
          test -f dist/privacy/index.html
          test -f dist/terms/index.html
  bootstrap-lockfile:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feat/website-foundation'
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/website-foundation
      - uses: actions/download-artifact@v4
        with:
          name: package-lock-bootstrap
          path: .lockfile-artifact
      - name: Commit generated lockfile if it is still missing
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json is already committed; no change needed."
            exit 0
          fi
          cp .lockfile-artifact/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:feat/website-foundation
