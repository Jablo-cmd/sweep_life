name: SWEEP Schools preview deployment

on:
  push:
    branches:
      - feat/website-foundation
      - fix/sweep-distinct-school-identity
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sweep-schools-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check Astro project
        run: npm run check

      - name: Build noindex preview
        env:
          PUBLIC_SITE_URL: https://sweep-preview.aurisnexus.co.za
          PUBLIC_INDEXING_ENABLED: "false"
        run: npm run build

      - name: Verify routes
        run: npm run test:routes

      - name: Verify preview quality and noindex safeguards
        env:
          PUBLIC_SITE_URL: https://sweep-preview.aurisnexus.co.za
          PUBLIC_INDEXING_ENABLED: "false"
        run: npm run test:quality

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
